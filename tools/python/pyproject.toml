[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poima-client"
version = "0.0.49"
description = "Standard-library automation client for the native Poima world service"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Divesh Gupta"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["poima_client*"]

[tool.setuptools.package-data]
poima_client = ["core_responses.v1.json", "core_responses.v1.candidate.json"]
